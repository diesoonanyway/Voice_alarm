<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Voice Alarm</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px 100px;
  }
  h1 { font-size: 1.6rem; margin-bottom: 8px; text-align: center; }
  .subtitle { color: #94a3b8; font-size: 0.85rem; margin-bottom: 24px; text-align: center; }

  .card {
    background: #1e293b; border-radius: 16px; padding: 20px;
    width: 100%; max-width: 420px; margin-bottom: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }
  .card h2 { font-size: 1.1rem; margin-bottom: 14px; color: #38bdf8; }

  label { font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 4px; }
  input[type="text"], input[type="number"] {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid #334155; background: #0f172a; color: #e2e8f0;
    font-size: 1rem; margin-bottom: 12px; outline: none;
  }
  input:focus { border-color: #38bdf8; }

  select {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid #334155; background: #0f172a; color: #e2e8f0;
    font-size: 1rem; margin-bottom: 12px; outline: none;
  }

  button {
    padding: 10px 18px; border-radius: 10px; border: none;
    font-size: 0.95rem; font-weight: 600; cursor: pointer;
    transition: transform 0.1s, opacity 0.15s;
  }
  button:active { transform: scale(0.96); }

  .btn-record { background: #ef4444; color: #fff; width: 100%; padding: 14px; font-size: 1.05rem; }
  .btn-record.recording { background: #dc2626; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }

  .btn-play { background: #22c55e; color: #fff; }
  .btn-delete { background: #475569; color: #e2e8f0; }
  .btn-add-alarm { background: #38bdf8; color: #0f172a; width: 100%; padding: 14px; font-size: 1.05rem; }
  .btn-remove { background: #ef4444; color: #fff; font-size: 0.8rem; padding: 6px 12px; }

  .clip-item, .alarm-item {
    display: flex; align-items: center; justify-content: space-between;
    background: #0f172a; border-radius: 10px; padding: 10px 14px;
    margin-bottom: 8px;
  }
  .clip-item span, .alarm-item span { font-size: 0.9rem; flex: 1; }
  .clip-actions { display: flex; gap: 6px; }

  .status {
    text-align: center; font-size: 0.85rem; margin-top: 8px;
    min-height: 20px;
  }
  .status.ok { color: #22c55e; }
  .status.err { color: #ef4444; }
  .status.info { color: #38bdf8; }

  .empty { color: #475569; font-size: 0.85rem; text-align: center; padding: 16px; }

  .alarm-item .alarm-info { flex: 1; }
  .alarm-item .alarm-name { font-size: 0.9rem; font-weight: 600; }
  .alarm-item .alarm-detail { font-size: 0.75rem; color: #94a3b8; }

  /* Alarm overlay */
  .alarm-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(15,23,42,0.95);
    z-index: 1000; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
  }
  .alarm-overlay.active { display: flex; }
  .alarm-overlay .alarm-icon { font-size: 4rem; animation: shake 0.4s infinite; }
  @keyframes shake {
    0%,100% { transform: rotate(0deg); }
    25% { transform: rotate(15deg); }
    75% { transform: rotate(-15deg); }
  }
  .alarm-overlay .alarm-label { font-size: 1.4rem; font-weight: 700; color: #38bdf8; text-align: center; padding: 0 20px; }
  .alarm-overlay .alarm-dismiss {
    background: #ef4444; color: #fff; padding: 16px 48px;
    border-radius: 14px; font-size: 1.1rem; font-weight: 700;
    border: none; cursor: pointer; margin-top: 12px;
  }

  /* Status bar */
  .status-bar {
    width: 100%; max-width: 420px; margin-bottom: 16px;
    background: #1e293b; border-radius: 12px; padding: 14px 16px;
    display: none; text-align: center;
  }
  .status-bar.active { display: block; }
  .status-bar .sb-status { font-size: 0.85rem; color: #22c55e; }
  .status-bar .sb-hint { font-size: 0.75rem; color: #64748b; margin-top: 4px; }

  /* Keep awake button */
  .btn-awake {
    background: #7c3aed; color: #fff; width: 100%; padding: 14px;
    font-size: 1.05rem; margin-top: 8px;
  }
  .btn-awake.on { background: #22c55e; }
</style>
</head>
<body>

<h1>Voice Alarm</h1>
<p class="subtitle">Record your voice and set recurring reminders</p>

<!-- STATUS BAR -->
<div class="status-bar" id="statusBar">
  <div class="sb-status" id="statusText">&#9989; Alarms running</div>
  <div class="sb-hint" id="statusHint">Screen will stay on. You can put your phone down.</div>
</div>

<!-- RECORD SECTION -->
<div class="card">
  <h2>Record a Voice Clip</h2>
  <label for="clipName">Clip name</label>
  <input type="text" id="clipName" placeholder="e.g. water, stand up, stretch">
  <button class="btn-record" id="recordBtn" onclick="toggleRecord()">Record</button>
  <div class="status" id="recordStatus"></div>
</div>

<!-- SAVED CLIPS -->
<div class="card">
  <h2>Saved Clips</h2>
  <div id="clipsList"><div class="empty">No clips yet. Record one above!</div></div>
</div>

<!-- SET ALARM -->
<div class="card">
  <h2>Set an Alarm</h2>
  <label for="alarmClip">Voice clip</label>
  <select id="alarmClip"><option value="">-- record a clip first --</option></select>

  <label for="alarmInterval">Repeat every (minutes)</label>
  <input type="number" id="alarmInterval" value="10" min="1" max="1440">

  <button class="btn-add-alarm" onclick="addAlarm()">+ Add Alarm</button>
  <button class="btn-awake" id="awakeBtn" onclick="toggleAwake()">&#128274; Keep Screen Awake</button>
</div>

<!-- ACTIVE ALARMS -->
<div class="card">
  <h2>Active Alarms</h2>
  <div id="alarmsList"><div class="empty">No alarms set.</div></div>
</div>

<!-- Audio element for manual playback (Play button) -->
<audio id="player" playsinline webkit-playsinline></audio>
<!-- Audio element for alarm playback (separate so they don't conflict) -->
<audio id="alarmPlayer" playsinline webkit-playsinline></audio>

<!-- ALARM POPUP OVERLAY -->
<div class="alarm-overlay" id="alarmOverlay">
  <div class="alarm-icon">&#128276;</div>
  <div class="alarm-label" id="alarmOverlayLabel">Reminder!</div>
  <button class="alarm-dismiss" id="alarmDismissBtn">Tap to hear &amp; dismiss</button>
</div>

<script>
// ── State ──
var clipBlobs = {};
var alarms = {};
var alarmCounter = 0;
var mediaRecorder = null;
var recordedChunks = [];
var isRecording = false;
var pendingAlarms = [];

// ── Get supported recording format ──
function getSupportedMimeType() {
  if (typeof MediaRecorder === 'undefined') return '';
  var types = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/aac', 'audio/ogg;codecs=opus'];
  for (var i = 0; i < types.length; i++) {
    try { if (MediaRecorder.isTypeSupported(types[i])) return types[i]; } catch(e) {}
  }
  return '';
}

// ── Playback — uses same pattern as test page Method 1 ──
function playClip(name) {
  var blob = clipBlobs[name];
  if (!blob) return;
  var url = URL.createObjectURL(blob);
  var audio = document.getElementById('player');
  audio.src = url;
  audio.load();
  var p = audio.play();
  if (p && p.then) {
    p.then(function() {
      audio.onended = function() { URL.revokeObjectURL(url); };
    }).catch(function() {});
  }
}

// ── Persistence (IndexedDB) ──
var DB_NAME = 'VoiceAlarmDB3';
var DB_VERSION = 1;
var db = null;

function openDB() {
  return new Promise(function(resolve, reject) {
    var req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = function(e) {
      var d = e.target.result;
      if (!d.objectStoreNames.contains('clips')) d.createObjectStore('clips');
      if (!d.objectStoreNames.contains('alarms')) d.createObjectStore('alarms');
    };
    req.onsuccess = function(e) { db = e.target.result; resolve(db); };
    req.onerror = function(e) { reject(e); };
  });
}

function dbPut(store, key, val) {
  return new Promise(function(resolve, reject) {
    var tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(val, key);
    tx.oncomplete = function() { resolve(); };
    tx.onerror = function(e) { reject(e); };
  });
}

function dbGet(store, key) {
  return new Promise(function(resolve, reject) {
    var tx = db.transaction(store, 'readonly');
    var req = tx.objectStore(store).get(key);
    req.onsuccess = function() { resolve(req.result); };
    req.onerror = function(e) { reject(e); };
  });
}

function dbDelete(store, key) {
  return new Promise(function(resolve, reject) {
    var tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = function() { resolve(); };
    tx.onerror = function(e) { reject(e); };
  });
}

function dbGetAll(store) {
  return new Promise(function(resolve, reject) {
    var tx = db.transaction(store, 'readonly');
    var s = tx.objectStore(store);
    var keys = []; var vals = [];
    var req = s.openCursor();
    req.onsuccess = function(e) {
      var c = e.target.result;
      if (c) { keys.push(c.key); vals.push(c.value); c.continue(); }
      else resolve({ keys: keys, vals: vals });
    };
    req.onerror = function(e) { reject(e); };
  });
}

// ── Recording ──
async function toggleRecord() {
  if (!isRecording) await startRecording();
  else stopRecording();
}

async function startRecording() {
  var name = document.getElementById('clipName').value.trim();
  if (!name) { setStatus('recordStatus', 'Enter a clip name first.', 'err'); return; }

  try {
    var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    var mimeType = getSupportedMimeType();
    var options = mimeType ? { mimeType: mimeType } : {};
    mediaRecorder = new MediaRecorder(stream, options);
    recordedChunks = [];

    mediaRecorder.ondataavailable = function(e) {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = async function() {
      stream.getTracks().forEach(function(t) { t.stop(); });
      var type = mediaRecorder.mimeType || mimeType || 'audio/mp4';
      var blob = new Blob(recordedChunks, { type: type });

      clipBlobs[name] = blob;
      await dbPut('clips', name, blob);
      renderClips();
      setStatus('recordStatus', 'Saved "' + name + '"', 'ok');
      document.getElementById('clipName').value = '';
    };

    mediaRecorder.start();
    isRecording = true;
    document.getElementById('recordBtn').textContent = 'Stop';
    document.getElementById('recordBtn').classList.add('recording');
    setStatus('recordStatus', 'Recording... speak now!', 'info');
  } catch (err) {
    setStatus('recordStatus', 'Mic access denied. Allow microphone.', 'err');
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  isRecording = false;
  document.getElementById('recordBtn').textContent = 'Record';
  document.getElementById('recordBtn').classList.remove('recording');
}

// ── Wake Lock (Keep Screen Awake) ──
var wakeLock = null;
var awakeOn = false;

async function toggleAwake() {
  if (!awakeOn) {
    await startAwake();
  } else {
    stopAwake();
  }
}

async function startAwake() {
  try {
    // Try the Wake Lock API (works on most modern browsers)
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', function() {
        // If released (e.g. tab switch), try to re-acquire
        if (awakeOn) {
          navigator.wakeLock.request('screen').then(function(wl) { wakeLock = wl; }).catch(function() {});
        }
      });
    }
  } catch(e) {
    // Wake Lock not supported or failed — screen may still dim
  }

  awakeOn = true;
  document.getElementById('awakeBtn').textContent = '🔓 Screen Awake — tap to turn off';
  document.getElementById('awakeBtn').classList.add('on');
  document.getElementById('statusBar').classList.add('active');

  // Also reduce screen brightness effect by dimming the page after 30s
  // (saves battery while keeping the screen technically "on")
}

function stopAwake() {
  awakeOn = false;
  if (wakeLock) {
    wakeLock.release();
    wakeLock = null;
  }
  document.getElementById('awakeBtn').textContent = '🔒 Keep Screen Awake';
  document.getElementById('awakeBtn').classList.remove('on');
  if (Object.keys(alarms).length === 0) {
    document.getElementById('statusBar').classList.remove('active');
  }
}

// Re-acquire wake lock when page becomes visible again
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'visible' && awakeOn && 'wakeLock' in navigator) {
    navigator.wakeLock.request('screen').then(function(wl) { wakeLock = wl; }).catch(function() {});
  }
});

// ── Alarm trigger ──
var alarmTimestamps = {}; // { id: nextFireTime }

function checkAlarms() {
  var now = Date.now();
  for (var id in alarms) {
    if (!alarms.hasOwnProperty(id)) continue;
    if (!alarmTimestamps[id]) continue;
    if (now >= alarmTimestamps[id]) {
      var clipName = alarms[id].clip;
      var interval = alarms[id].interval;
      alarmTimestamps[id] = now + (interval * 60 * 1000);

      // Play the alarm
      if (clipBlobs[clipName]) {
        var url = URL.createObjectURL(clipBlobs[clipName]);
        var ap = document.getElementById('alarmPlayer');
        ap.src = url;
        ap.load();
        var p = ap.play();
        if (p && p.then) {
          p.then(function(u) { return function() {
            ap.onended = function() { URL.revokeObjectURL(u); };
          }; }(url)).catch(function() {});
        }
      }
      if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300]);
    }
  }
}

setInterval(checkAlarms, 1000);

function showAlarmOverlay(clipName) {
  pendingAlarms.push(clipName);
  document.getElementById('alarmOverlayLabel').textContent = 'Reminder: ' + clipName;
  document.getElementById('alarmOverlay').classList.add('active');
}

document.getElementById('alarmDismissBtn').addEventListener('click', function() {
  while (pendingAlarms.length > 0) {
    playClip(pendingAlarms.shift());
  }
  document.getElementById('alarmOverlay').classList.remove('active');
});

// ── Clips UI ──
function renderClips() {
  var container = document.getElementById('clipsList');
  var names = Object.keys(clipBlobs).sort();

  if (names.length === 0) {
    container.innerHTML = '<div class="empty">No clips yet. Record one above!</div>';
  } else {
    container.innerHTML = names.map(function(n) {
      var escaped = esc(n);
      return '<div class="clip-item">' +
        '<span>' + escaped + '</span>' +
        '<div class="clip-actions">' +
        '<button class="btn-play" onclick="playClip(\'' + escaped + '\')">Play</button>' +
        '<button class="btn-delete" onclick="deleteClip(\'' + escaped + '\')">Delete</button>' +
        '</div></div>';
    }).join('');
  }

  var select = document.getElementById('alarmClip');
  var prev = select.value;
  select.innerHTML = names.length
    ? names.map(function(n) { return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join('')
    : '<option value="">-- record a clip first --</option>';
  if (prev && names.includes(prev)) select.value = prev;
}

async function deleteClip(name) {
  delete clipBlobs[name];
  await dbDelete('clips', name);
  renderClips();
}

// ── Alarms ──
function addAlarm() {
  var clipName = document.getElementById('alarmClip').value;
  if (!clipName || !clipBlobs[clipName]) { alert('Select a voice clip first.'); return; }

  var interval = parseInt(document.getElementById('alarmInterval').value);
  if (!interval || interval < 1) { alert('Enter a valid interval (1+ minutes).'); return; }

  var id = alarmCounter++;
  var ms = interval * 60 * 1000;

  alarms[id] = { clip: clipName, interval: interval };
  alarmTimestamps[id] = Date.now() + ms; // first fire after one interval

  saveAlarms();
  renderAlarms();
  document.getElementById('statusBar').classList.add('active');
}

function removeAlarm(id) {
  if (alarms[id]) {
    delete alarms[id];
    delete alarmTimestamps[id];
    saveAlarms();
    renderAlarms();

    if (Object.keys(alarms).length === 0 && !awakeOn) {
      document.getElementById('statusBar').classList.remove('active');
    }
  }
}

function renderAlarms() {
  var container = document.getElementById('alarmsList');
  var ids = Object.keys(alarms);

  if (ids.length === 0) {
    container.innerHTML = '<div class="empty">No alarms set.</div>';
  } else {
    container.innerHTML = ids.map(function(id) {
      var a = alarms[id];
      return '<div class="alarm-item">' +
        '<div class="alarm-info">' +
        '<div class="alarm-name">"' + esc(a.clip) + '"</div>' +
        '<div class="alarm-detail">every ' + a.interval + ' min</div>' +
        '</div>' +
        '<button class="btn-remove" onclick="removeAlarm(' + id + ')">Remove</button>' +
        '</div>';
    }).join('');
  }
}

async function saveAlarms() {
  var data = {};
  for (var id in alarms) {
    if (alarms.hasOwnProperty(id)) {
      data[id] = { clip: alarms[id].clip, interval: alarms[id].interval };
    }
  }
  await dbPut('alarms', 'active', data);
}

async function loadAlarms() {
  var data = await dbGet('alarms', 'active');
  if (!data) return;
  var hasAlarms = false;
  for (var id in data) {
    if (!data.hasOwnProperty(id)) continue;
    var a = data[id];
    if (!clipBlobs[a.clip]) continue;
    var numId = parseInt(id);
    var ms = a.interval * 60 * 1000;
    alarms[numId] = { clip: a.clip, interval: a.interval };
    alarmTimestamps[numId] = Date.now() + ms;
    if (numId >= alarmCounter) alarmCounter = numId + 1;
    hasAlarms = true;
  }
  renderAlarms();
  if (hasAlarms) document.getElementById('statusBar').classList.add('active');
}

// ── Helpers ──
function esc(s) { return s.replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function setStatus(id, msg, cls) {
  var el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'status ' + (cls || '');
}

// ── Init ──
async function init() {
  await openDB();

  var result = await dbGetAll('clips');
  for (var i = 0; i < result.keys.length; i++) {
    var blob = result.vals[i];
    if (typeof blob === 'string') {
      try { var resp = await fetch(blob); blob = await resp.blob(); } catch(e) { continue; }
    }
    clipBlobs[result.keys[i]] = blob;
  }
  renderClips();
  await loadAlarms();
}

init();
</script>
</body>
</html>
